name: Update data and deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/projects.json"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "docs/**"
      - "README.md"
      - "*.zip"
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test parser
        run: npm test
      - name: Sync upstream directory (no COS upload yet)
        run: node scripts/sync-data.mjs --no-upload
      - name: Build static site (SSG)
        run: node scripts/build.mjs --sync-dist
      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json index.html sitemap.xml robots.txt llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sync data and rebuild static site" || echo "Nothing to commit"
          git pull --rebase -X theirs origin main || true
          git push
      # COS 只是 app.js 的【兜底数据源】（站点本地 data/projects.json 才是主源）。
      # 它绝不能阻断部署：2026-09-20 一次 COS 连接超时（ConnectTimeoutError）导致本步骤
      # 失败 → 后续 Deploy to EdgeOne 与 IndexNow 被 skip → 整站发不出去。
      # 故改为「重试 3 次 + 失败不阻断」，最坏只影响兜底快照的新鲜度。
      - name: Upload snapshot to COS (after build, keeps COS in sync with site)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if node scripts/sync-data.mjs --upload-only; then
              echo "COS 上传成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::COS 上传第 $i 次失败，10 秒后重试"
            sleep 10
          done
          echo "::warning::COS 上传 3 次均失败——已跳过，站点部署不受影响"
          exit 0
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
      # ⚠️ 为什么要在部署命令后面接 sed：
      #   `edgeone makers deploy --json` 会把带 eo_token 的预览地址原样写进日志，
      #   而本仓库是 public —— 等于每次部署都把一枚「可访问该次预览站」的临时 token
      #   公开出去（2026-09-21 实测：该 token 约 1 小时过期，事后不可利用，但属持续暴露面）。
      #   这里只脱敏 token 与预览域名，其余诊断信息全部保留。
      #   `set -o pipefail` 是必需的：否则 sed 的成功退出码会盖掉部署失败的退出码，
      #   出现「部署失败但 CI 显示绿灯」的假成功。
      - name: Deploy to EdgeOne Makers (main domain indiemaker.cn)
        run: |
          set -o pipefail
          npm install -g edgeone@latest
          edgeone makers deploy dist/ -n indie-maker-directory --json 2>&1 \
            | sed -E 's/eo_token=[A-Za-z0-9._-]+/eo_token=***REDACTED***/g; s/[a-z0-9-]+\.edgeone\.(cool|app)/***REDACTED***.edgeone.\1/g'
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          PAGES_SOURCE: skills
      # 部署完成后主动通知搜索引擎（IndexNow 覆盖 Bing / Yandex / Naver 等）。
      # Google 不参与 IndexNow，靠 sitemap + 爬虫自然发现；百度需在站长平台单独配置推送。
      # 放在部署之后，确保引擎来抓时页面已就绪；失败不阻塞发布流程。
      - name: Notify search engines via IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      # ⚠️ path 必须是 dist/ 而不是 . —— 2026-09-21 实测：上传整仓库会把与站点无关的
      # 东西一起发布成公开网页，实测以下地址全部 200：
      #   /docs/现状与待办-2026-09-21.md、/docs/umami/2026-09-21.md（内部流量分析）、
      #   /README.md、/scripts/*、/tests/*、以及散落在根目录的截图。
      # dist/ 正是 EdgeOne 的部署源，改成它之后 GitHub Pages 仍是站点的完整镜像
      # （含 p/ c/ en/ data/ 与运行时资源），只是不再夹带仓库内部文件。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
