name: Update data and deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/projects.json"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "docs/**"
      - "README.md"
      - "*.zip"
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test parser
        run: npm test
      - name: Sync upstream directory (no COS upload yet)
        run: node scripts/sync-data.mjs --no-upload
      - name: Build static site (SSG)
        run: node scripts/build.mjs --sync-dist
      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json index.html sitemap.xml robots.txt llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sync data and rebuild static site" || echo "Nothing to commit"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Upload snapshot to COS (after build, keeps COS in sync with site)
        run: node scripts/sync-data.mjs --upload-only
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
      - name: Deploy to EdgeOne Makers (main domain indiemaker.cn)
        run: |
          npm install -g edgeone@latest
          edgeone makers deploy dist/ -n indie-maker-directory --json
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          PAGES_SOURCE: skills
      # 部署完成后主动通知搜索引擎（IndexNow 覆盖 Bing / Yandex / Naver 等）。
      # Google 不参与 IndexNow，靠 sitemap + 爬虫自然发现；百度需在站长平台单独配置推送。
      # 放在部署之后，确保引擎来抓时页面已就绪；失败不阻塞发布流程。
      - name: Notify search engines via IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
